# httpd-phptest.conf - a test VSI Apache 2.4 (APACHEWS V2.4-62) server in front of
# PHP for OpenVMS over FastCGI (mod_proxy_fcgi). Installed as
# [.APACHE_TRY.CONF]HTTPD-PHPTEST.CONF in the work directory and started with
#   @SYS$STARTUP:APACHE$STARTUP START <that file>
# Port 18090; the test scripts in @DOCROOT@ (UNIX form; the test generates the
# file): APACHE$WWW is in the developer's UIC group, so a group-readable tree
# serves; PHP is a FastCGI pool of PHP_CGI.EXE -b on 127.0.0.1:19100
# (vms-lighttpd's test pool). Logs go to APACHE$SPECIFIC:[LOGS].
ServerRoot "/apache$root"
Listen 18090
ServerName localhost
PidFile logs/phptest.pid

LoadModule unixd_module         modules/mod_unixd.exe
LoadModule authz_core_module    modules/mod_authz_core.exe
LoadModule mime_module          modules/mod_mime.exe
LoadModule dir_module           modules/mod_dir.exe
LoadModule log_config_module    modules/mod_log_config.exe
LoadModule alias_module         modules/mod_alias.exe
LoadModule setenvif_module      modules/mod_setenvif.exe
LoadModule proxy_module         modules/mod_proxy.exe
LoadModule proxy_fcgi_module    modules/mod_proxy_fcgi.exe

# VSI's prefork MPM starts its children under this account (a persona); without
# it: "error creating persona for #-1"
<IfModule unixd_module>
    User APACHE$WWW
    Group #-1
</IfModule>
StartServers         2
MinSpareServers      2
MaxSpareServers      4
MaxRequestWorkers    4

ErrorLog logs/phptest_error_log
LogLevel warn proxy_fcgi:info
LogFormat "%h %l %u %t \"%r\" %>s %b %D" timed
CustomLog logs/phptest_access_log timed
TypesConfig conf/mime.types

DocumentRoot "@DOCROOT@"
<Directory "@DOCROOT@">
    Require all granted
    AllowOverride None
</Directory>
DirectoryIndex index.php index.html

# PHP: every .php file to the FastCGI pool. mod_proxy_fcgi passes the script's
# path as SCRIPT_FILENAME and the rest of the URL as PATH_INFO.
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:19100"
</FilesMatch>
