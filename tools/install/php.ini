; VMSPHP$ROOT:[ETC]PHP.INI for the staged test tree (tools/stage.sh).
; The FastCGI pool runs with its own -c file; this one is for PHP.EXE.
; The kit's template comes in Phase 5.
[PHP]
memory_limit = 256M
error_reporting = E_ALL
display_errors = stderr
log_errors = Off
sys_temp_dir = /vmsphp$root/tmp
enable_dl = Off

[Date]
date.timezone = UTC

[opcache]
opcache.enable_cli = 0

[openssl]
; VSI's SSL3 kit has no CA certificates (PORTING_LOG #57): the pinned bundle as
; a hashed directory. Not openssl.cafile: SSL3's OpenSSL parses the whole file on
; every handshake (6.5 s). VMS syntax: OpenSSL takes a capath without ']' or ':'
; for a logical name and appends ':'.
openssl.capath = "VMSPHP$ROOT:[ETC.CERTS]"
