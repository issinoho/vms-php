# Upstream PHP release this port is built from (docs/DECISIONS.md D1).
UPSTREAM_NAME=php
UPSTREAM_VERSION=8.5.12
UPSTREAM_URL=https://www.php.net/distributions/php-8.5.12.tar.xz
UPSTREAM_SHA256=08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
# The PHP 8.5 release managers (https://www.php.net/gpg-keys.php), any of whom signs
# a release (DECISIONS D27): Pierrick Charron, Volker Dusch, Daniel Scherzer; exported
# from https://www.php.net/distributions/php-keyring.gpg.  Public keys:
# keys/php-8.5-signing-keys.asc.  8.5.12 is signed by Daniel Scherzer.
UPSTREAM_GPG_KEYS="1198C0117593497A5EC5C199286AF1F9897469DC 49D9AF6BC72A80D6691719C8AA23F5BE9C7097D4 D95C03BC702BE9515344AE3374E44BC9067701A5"
# Our patch level on top of the upstream release (8.5.12-vms2: SQLite and PDO, D28)
VMS_PATCH_LEVEL=2
# Dependencies built with clang (LP64) by the sibling repos on the node
# (docs/DECISIONS.md D4): <workdir>.<TREE>.INSTALL_X86_64_CLANG] (INCLUDE, LIB).
ZLIB_VERSION=1.3.2
ZLIB_TREE=ZLIB-1_3_2
PCRE2_VERSION=10.49
PCRE2_TREE=PCRE2-10_49
# TLS: VSI's SSL3 kit (OpenSSL 3.0), its 64-bit-pointer images.
SSL_KIT=SSL3
# libxml2, built with clang by vms-libxml2 (DECISIONS D4)
LIBXML2_VERSION=2.15.4
LIBXML2_TREE=LIBXML2-2_15_4
# SQLite, built with clang by vms-sqlite (DECISIONS D28), whose tools/deploy.sh copies its
# install tree to the dependency directory. The same release is built on the host
# (tools/host_sqlite3.sh) with vms-sqlite's compile-time options, for configure. SQLite
# publishes no signatures: the SHA3-256 of sqlite.org's download page, as vms-sqlite pins it.
SQLITE3_VERSION=3.54.1
SQLITE3_TREE=SQLITE-3_54_1
SQLITE3_URL=https://sqlite.org/2026/sqlite-autoconf-3540100.tar.gz
SQLITE3_SHA3=b6ced585c750916b1052667239a12c25a7ff34e7f06e1e6e01ecb0427657d9c4
# vms-sqlite's options (its DECISIONS D4, D9) that change SQLite's API, for the host build
SQLITE3_HOST_CFLAGS="-DSQLITE_THREADSAFE=1 -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_WAL -DSQLITE_MAX_MMAP_SIZE=0 -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_MATH_FUNCTIONS"
# Configure options for the VMS build (DECISIONS D3), used on the host by
# tools/host_configure.sh: the phpBB extension set, CLI and CGI only, PCRE2
# external (vms-pcre2) without JIT, no opcache JIT; and since 8.5.12-vms2 (D28) PDO
# with pdo_mysql (mysqlnd) and pdo_sqlite, and sqlite3 (vms-sqlite).
PHP_CONFIGURE_OPTIONS="--disable-all --enable-cli --enable-cgi --disable-phpdbg --without-pear --enable-ctype --enable-filter --enable-mbstring --disable-mbregex --enable-mysqlnd --with-mysqli --enable-session --enable-tokenizer --with-zlib --with-libxml --enable-dom --enable-xml --enable-simplexml --enable-xmlreader --enable-xmlwriter --with-openssl --with-external-pcre --without-pcre-jit --disable-opcache-jit --enable-pdo --with-pdo-mysql=mysqlnd --with-sqlite3 --with-pdo-sqlite"
# CA certificates for PHP's openssl (PORTING_LOG #57): VSI's SSL3 kit ships none
# (SSL3$CERTS is its empty demo CA directory). Mozilla's root store as extracted
# by curl.se (https://curl.se/docs/caextract.html), the bundle vms-curl pins;
# installed as VMSPHP$ROOT:[ETC]CACERT.PEM, PHP.INI's openssl.cafile.
CA_BUNDLE_URL=https://curl.se/ca/cacert-2026-09-25.pem
CA_BUNDLE_SHA256=a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
# Argon2 for password_hash()/password_verify() (D24): the board's 8.1 kit hashed its
# users' passwords with argon2id. The reference implementation (P-H-C/phc-winner-argon2,
# the Argon2 authors', CC0/Apache-2.0), its last release, compiled into PHP by BUILD.COM.
# GitHub's tag archive is not signed: the SHA-256 is pinned at first download.
ARGON2_VERSION=20190702
ARGON2_URL=https://github.com/P-H-C/phc-winner-argon2/archive/refs/tags/20190702.tar.gz
ARGON2_SHA256=daf972a89577f8772602bf2eb38b6a3dd3d922bf5724d45e7f9589b5e830442c
# The PCSI kit (DECISIONS D25): product VMSPHP (VSI's PHP comes with its Apache
# kit), producer as the sibling kits.
KIT_PRODUCER=ISSINOHO
KIT_PRODUCT=VMSPHP
