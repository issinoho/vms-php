# Upstream PHP release this port is built from (docs/DECISIONS.md D1).
UPSTREAM_NAME=php
UPSTREAM_VERSION=8.5.11
UPSTREAM_URL=https://www.php.net/distributions/php-8.5.11.tar.xz
UPSTREAM_SHA256=d9be75c08e8c316f4c8f4194d8fbe1750a15f6a6d9d4e3fe72082abeeb800360
# Volker Dusch <edorian@php.net>, PHP 8.5 release manager; exported from
# https://www.php.net/distributions/php-keyring.gpg.  Public key: keys/php-8.5-signing-key.asc
UPSTREAM_GPG_KEY=49D9AF6BC72A80D6691719C8AA23F5BE9C7097D4
# Our patch level on top of the upstream release (8.5.11-vms1)
VMS_PATCH_LEVEL=1
# Dependencies built with clang (LP64) by the sibling repos on the node
# (docs/DECISIONS.md D4): <workdir>.<TREE>.INSTALL_X86_64_CLANG] (INCLUDE, LIB).
ZLIB_VERSION=1.3.2
ZLIB_TREE=ZLIB-1_3_2
PCRE2_VERSION=10.49
PCRE2_TREE=PCRE2-10_49
# TLS: VSI's SSL3 kit (OpenSSL 3.0), its 64-bit-pointer images.
SSL_KIT=SSL3
# libxml2, built with clang by vms-libxml2 (DECISIONS D4)
LIBXML2_VERSION=2.15.4
LIBXML2_TREE=LIBXML2-2_15_4
# Configure options for the VMS build (DECISIONS D3), used on the host by
# tools/host_configure.sh: the phpBB extension set, CLI and CGI only, PCRE2
# external (vms-pcre2) without JIT, no opcache JIT.
PHP_CONFIGURE_OPTIONS="--disable-all --enable-cli --enable-cgi --disable-phpdbg --without-pear --enable-ctype --enable-filter --enable-mbstring --disable-mbregex --enable-mysqlnd --with-mysqli --enable-session --enable-tokenizer --with-zlib --with-libxml --enable-dom --enable-xml --enable-simplexml --enable-xmlreader --enable-xmlwriter --with-openssl --with-external-pcre --without-pcre-jit --disable-opcache-jit"
